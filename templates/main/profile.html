{% extends 'main/base.html' %} {% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow border-0">
        <div class="card-header bg-dark text-white text-center py-3">
          <h4 class="mb-0">Пайдаланушы профилі</h4>
        </div>
        <div class="card-body p-4 text-center">
          <div class="mb-4">
            <div
              class="rounded-circle bg-primary d-inline-block text-white mb-3"
              style="
                width: 80px;
                height: 80px;
                line-height: 80px;
                font-size: 2rem;
              "
            >
              {{ user.username|first|upper }}
            </div>
            <h3 class="fw-bold">{{ user.username }}</h3>
            <p class="text-muted">
              {{ user.email|default:"Email көрсетілмеген" }}
            </p>
          </div>

          <ul class="list-group list-group-flush text-start">
            <li
              class="list-group-item d-flex justify-content-between align-items-center"
            >
              <span>Тіркелген күні:</span>
              <span class="fw-bold text-dark"
                >{{ user.date_joined|date:"d.m.Y" }}</span
              >
            </li>
            <li
              class="list-group-item d-flex justify-content-between align-items-center"
            >
              <span>Статус:</span>
              <span class="badge bg-success">Белсенді</span>
            </li>
          </ul>

          <div class="mt-4">
            <a
              href="{% url 'index' %}"
              class="btn btn-outline-dark rounded-pill px-4"
              >Басты бетке қайту</a
            >
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
